name: CI Pipeline

on:
  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Frontend Tests
  # =========================================================
  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check frontend files exist
        run: |
          test -f frontend/Dockerfile || { echo "frontend/Dockerfile is missing"; exit 1; }
          echo "Frontend folder contents:"
          ls -la frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend unit tests (if defined)
        working-directory: frontend
        run: |
          if [ -f package.json ] && node -e "const s=(require('./package.json').scripts||{}).test; process.exit(s && !s.includes('no test specified') ? 0 : 1)"; then
            echo "Test script found - running npm test"
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test
          else
            echo "No npm test script in frontend - skipping unit tests"
          fi

      - name: Build frontend Docker image
        run: |
          docker build -t koalatech-frontend:ci-test ./frontend

      - name: Start frontend container
        run: |
          PORT=$(grep -i '^EXPOSE' frontend/Dockerfile | awk '{print $2}' | head -1)
          PORT=${PORT:-80}
          echo "Container port: $PORT"
          docker run -d --name frontend-test \
            --add-host user-service:127.0.0.1 \
            --add-host student-service:127.0.0.1 \
            --add-host lecturer-service:127.0.0.1 \
            --add-host course-service:127.0.0.1 \
            --add-host enrollment-service:127.0.0.1 \
            -p 8080:$PORT \
            koalatech-frontend:ci-test

      - name: Smoke test - frontend serves home page
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/ -o page.html; then
              echo "Frontend responded on attempt $i"
              break
            fi
            echo "Waiting for frontend... ($i)"
            sleep 2
          done

          # Fail if the container stopped or the page never loaded
          docker ps --filter name=frontend-test --filter status=running | grep -q frontend-test \
            || { echo "Frontend container is not running"; exit 1; }
          test -s page.html || { echo "Frontend did not return a page"; exit 1; }

          # Fail if the response is not an HTML page
          grep -qi "<html" page.html || { echo "Response is not an HTML page"; exit 1; }

          echo "Frontend smoke test passed"
          head -n 20 page.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs frontend-test || true

      - name: Clean up
        if: always()
        run: docker rm -f frontend-test || true


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend AND frontend tests must pass before this job starts
    needs:
      - backend-test
      - frontend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest \
            ./${{ matrix.service }}

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Push Docker image with latest tag
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
